      with:
        sarif_file: ecommerce-checkout-price-results.sarif
        category: ecommerce-checkout-price
  ecommerce-pci-card-data-no-logging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        persist-credentials: false
    - name: scan-pci-card-data-leak
      run: "# Set up output capture for the annotation-to-SARIF step.\nexec > >(tee\
        \ -a ecommerce-pci-card-logging.shell_log) 2>&1\n# Run the original script\
        \ in a subshell with set +e so\n# that any single command failure does not\
        \ abort the\n# script before it can emit a '::error' annotation.\ninner_exit=0\n\
        ( set +e\nfail=0\n# Detect card-like fields passed to loggers or stored in\
        \ plaintext\nif grep -rnE '(console\\.log|logger\\.(info|debug|warn)|winston\\\
        .log)\\s*\\([^)]*(card[_-]?number|pan|cvv|cvc)' src/ 2>/dev/null | grep -q\
        \ .; then\n  echo '::error file=src/payments/log.ts::Card data (PAN/CVV) passed\
        \ to logger \u2014 strip before logging (PCI DSS 3.2)'\n  fail=1\nfi\n# Detect\
