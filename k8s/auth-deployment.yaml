apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: healthcare-micro-vuln/auth:latest
        securityContext:
          privileged: true
          runAsUser: 0
        env:
        - name: DB_PASS
          value: "secret123"
        - name: JWT_SECRET
          value: "weakjwtsecret"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth
  ports:
  - port: 8000
    targetPort: 8000
